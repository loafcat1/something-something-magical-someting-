<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smile — ECHO</title><link rel="stylesheet" href="style.css"></head><body><main><div class="kicker">PROJECT ECHO · FILE 003</div><div class="emoji">🙂🗝️</div><h1>Good work, detective.</h1><p>The filing department (one sleepy pigeon) locked the next note in a Caesar cipher. Move each letter <b>one place backward</b> in the alphabet.</p><div class="code">UIF GJOBM OPUF JT JO UIF QPDLFU</div><form id="f"><input id="g" placeholder="decoded sentence" aria-label="Decoded sentence"><button class="btn">Unlock note</button><p id="m" class="feedback" aria-live="polite"></p></form><p class="small">Hint: T becomes S, B becomes A. Wrap around at the beginning.</p><div class="footer"><a href="field-notes.html">← Field notes</a></div></main><script>f.onsubmit=e=>{e.preventDefault();let v=g.value.trim().toUpperCase().replace(/[^A-Z ]/g,'').replace(/\s+/g,' ');if(v==='THE FINAL NOTE IS IN THE POCKET'){m.textContent='Unlocked! 💌';setTimeout(()=>location.href='pocket.html',600)}else m.textContent='Shift each letter one place backward.'}</script></body></html>
